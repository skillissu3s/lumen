<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Lumen</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Set the theme before first paint so there is no flash of the wrong scheme.
      (function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('lumen.theme') || 'system'
        } catch (e) {
          /* storage unavailable */
        }
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        try {
          document.documentElement.dataset.palette = localStorage.getItem('lumen.palette') || 'default'
        } catch (e) {
          /* storage unavailable */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
