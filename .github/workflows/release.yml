# Push a tag like vX.Y.Z that matches the version in package.json. The workflow
# builds installers on Windows, macOS and Linux and publishes them as a release
# of the PUBLIC repository skillissu3s/lumen-releases (the source stays private).
# Installed apps check that repository and update themselves.
#
# Needs the secret RELEASES_TOKEN: a fine-grained token with access to only
# skillissu3s/lumen-releases and the permission Contents: Read and write.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Check the release token
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Add the RELEASES_TOKEN secret (see the top of this file)"; exit 1; fi
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
