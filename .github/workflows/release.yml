# Builds the installers when a tag vX.Y.Z (matching package.json) is pushed, and
# keeps them in a DRAFT release of this private repository — using only the
# built-in token, no secrets.
#
# `node scripts/publish-release.mjs vX.Y.Z` then copies them to the public
# skillissu3s/lumen-releases repository, where people download them and where
# installed apps look for updates (see package.json → build.publish).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Make sure the draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "Lumen ${TAG#v}" --notes "Build of $TAG"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build
      # --publish never: build only (latest*.yml for the update feed is still written)
      - run: npx electron-builder --publish never
      - name: Attach the installers to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.AppImage release/*.deb release/*.blockmap release/latest*.yml)
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
