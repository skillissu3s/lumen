# Push a tag vX.Y.Z (matching package.json) and this builds the Windows, macOS
# and Linux installers and publishes them as the latest release — with the
# version's section of CHANGELOG.md as the notes. Installed apps update from it.
# Uses only the built-in token.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release with the changelog notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {f=1; sub(/^## /, ""); title=$0; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          title=$(grep -m1 "^## $version " CHANGELOG.md | sed 's/^## /Lumen /')
          [ -s notes.md ] || echo "Lumen $version" > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "${title:-Lumen $version}" --notes-file notes.md

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build
      # uploads into the draft made above (electron-builder finds it by tag)
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
